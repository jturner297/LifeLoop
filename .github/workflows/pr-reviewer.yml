name: Strict iOS Code Reviewer

on:
  pull_request:
    branches:
      - IOS-App

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Code Diff
        id: get_diff
        run: |
          # Fetch the base branch to compare against the incoming PR
          git fetch origin ${{ github.event.pull_request.base.ref }}
          
          # Grab the actual diff
          DIFF=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD)
          
          # Securely pack the multiline diff into a GitHub environment variable
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "PR_DIFF<<$EOF" >> $GITHUB_ENV
          echo "$DIFF" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Execute Gemini Code Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const diff = process.env.PR_DIFF;
            
            if (!diff || diff.trim() === '') {
              console.log("No code changes detected in this PR.");
              return;
            }

            const prompt = `You are a strict iOS code reviewer. Review the following Swift code diff. Focus on identifying SwiftUI presentation hierarchy conflicts, CoreBluetooth thread safety issues, and memory leaks. Keep the feedback concise and constructive. If the code is solid, just reply "Looks good to me."\n\nCode Diff:\n${diff}`;

            const requestBody = {
              contents: [{
                parts: [{ text: prompt }]
              }],
              generationConfig: {
                temperature: 0.2
              }
            };

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            
            // 1. The debug line we discussed to catch the exact API rejection reason
            console.log("RAW GEMINI RESPONSE:", JSON.stringify(data, null, 2));

            // 2. Safely check if the response actually contains the candidates array before extracting text
            if (!response.ok || !data.candidates || data.candidates.length === 0) {
              core.setFailed(`Gemini API rejected the request. Check the raw response above for details.`);
              return;
            }

            // 3. Extract the clean AI review string
            const review = data.candidates[0].content.parts[0].text;

            // 4. Post the review automatically as a PR comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Gemini Code Review\n\n${review}`
            });
