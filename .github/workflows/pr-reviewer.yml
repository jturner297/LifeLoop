name: Strict iOS Code Reviewer

on:
  pull_request:
    branches:
      - IOS-App

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Code Diff
        shell: bash
        run: |
          set -euo pipefail

          # Fetch the PR base branch.
          git fetch origin "${{ github.event.pull_request.base.ref }}"

          # Generate the diff between the PR and its base branch.
          git diff \
            "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
            > pr.diff

          # Store the multiline diff securely for the next step.
          EOF_MARKER="PR_DIFF_$(openssl rand -hex 16)"

          {
            echo "PR_DIFF<<${EOF_MARKER}"
            cat pr.diff
            echo "${EOF_MARKER}"
          } >> "$GITHUB_ENV"

      - name: Execute Gemini Code Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const diff = process.env.PR_DIFF;

            if (!diff || diff.trim() === "") {
              console.log("No code changes detected in this PR.");
              return;
            }

            if (!process.env.GEMINI_API_KEY) {
              core.setFailed("GEMINI_API_KEY is not configured.");
              return;
            }

            const prompt = `
You are a strict iOS code reviewer.

Review the following Swift code diff from a pull request.

Focus specifically on:

1. Swift compilation errors.
2. SwiftUI presentation hierarchy conflicts, including sheets, covers,
   navigation destinations, alerts, and full-screen presentations.
3. CoreBluetooth thread-safety and delegate queue issues.
4. Incorrect Bluetooth service or characteristic discovery.
5. Memory-management problems, retain cycles, and unsafe optional handling.
6. Concurrency issues involving actors, MainActor, Tasks, async/await,
   and UI updates.
7. Data races and state-management problems.
8. Security, privacy, and sensitive-data exposure.
9. Logic errors and regressions.
10. Missing error handling.

For every issue, include:

- Severity: Critical, High, Medium, or Low
- File and line if available
- Explanation of the problem
- A concrete code fix

If there are no significant issues, say so clearly.

Do not invent issues unrelated to the diff.

PULL REQUEST DIFF:
${diff}
`;

            const requestBody = {
              contents: [
                {
                  parts: [
                    {
                      text: prompt
                    }
                  ]
                }
              ],
              generationConfig: {
                temperature: 0.2
              }
            };

            const models = [
              "gemini-3.6-flash",
              "gemini-2.5-flash"
            ];

            const retryableStatuses = new Set([
              429,
              500,
              502,
              503,
              504
            ]);

            const maxAttemptsPerModel = 4;
            let response = null;
            let data = null;
            let successfulModel = null;

            for (const model of models) {
              console.log(`Trying Gemini model: ${model}`);

              for (
                let attempt = 1;
                attempt <= maxAttemptsPerModel;
                attempt++
              ) {
                response = await fetch(
                  `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${process.env.GEMINI_API_KEY}`,
                  {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestBody)
                  }
                );

                const responseText = await response.text();

                try {
                  data = responseText ? JSON.parse(responseText) : {};
                } catch {
                  data = {
                    error: {
                      message: responseText
                    }
                  };
                }

                if (
                  response.ok &&
                  Array.isArray(data.candidates) &&
                  data.candidates.length > 0
                ) {
                  successfulModel = model;
                  break;
                }

                console.log(
                  `Gemini request failed for ${model}, attempt ${attempt}/${maxAttemptsPerModel}, HTTP ${response.status}`
                );

                console.log(
                  "Gemini response:",
                  JSON.stringify(data, null, 2)
                );

                const shouldRetry =
                  retryableStatuses.has(response.status) &&
                  attempt < maxAttemptsPerModel;

                if (!shouldRetry) {
                  break;
                }

                // Exponential backoff: 5s, 10s, 20s.
                const delayMs = Math.min(
                  30000,
                  5000 * Math.pow(2, attempt - 1)
                );

                console.log(`Retrying in ${delayMs} ms...`);

                await new Promise((resolve) =>
                  setTimeout(resolve, delayMs)
                );
              }

              if (successfulModel) {
                break;
              }

              // Do not try another model for non-transient errors.
              if (
                response &&
                !retryableStatuses.has(response.status)
              ) {
                break;
              }
            }

            console.log(
              "RAW GEMINI RESPONSE:",
              JSON.stringify(data, null, 2)
            );

            if (
              !response ||
              !response.ok ||
              !Array.isArray(data?.candidates) ||
              data.candidates.length === 0
            ) {
              const status = response?.status ?? "unknown";
              const message =
                data?.error?.message ??
                "No usable response was returned by Gemini.";

              core.setFailed(
                `Gemini API request failed with HTTP ${status}: ${message}`
              );
              return;
            }

            const review =
              data.candidates[0]?.content?.parts
                ?.map((part) => part.text || "")
                .join("")
                .trim();

            if (!review) {
              core.setFailed(
                `Gemini returned an empty review using model ${successfulModel}.`
              );
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 🤖 Gemini Code Review\n\n${review}`
            });

            console.log(
              `Gemini review posted successfully using ${successfulModel}.`
            );
