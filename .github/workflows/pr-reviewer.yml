name: Strict iOS Code Reviewer
on:
  pull_request:
    branches:
      - IOS-App
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Review Agent
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              mediaType: { format: 'diff' }
            });

            const systemPrompt = "You are a strict Senior iOS Code Reviewer for the LifeLoop repository. Your job is to review all Pull Requests targeting the IOS-App branch. Critique the Swift code based on the following rules:\n1. Modularity: UI components must be separated from logic.\n2. Safety: Flag any force-unwrapping (using !) as a critical error.\n3. Performance: Ensure CoreLocation and BLE tasks have appropriate rate-limiting.\n\nIf the code violates these rules, leave a comment on the specific line in the PR explaining why it is wrong and request changes.";

            const payload = {
              contents: [{
                parts: [{
                  text: `${systemPrompt}\n\nPlease review the following PR diff and provide your critique formatted in Markdown:\n\n${diff}`
                }]
              }]
            };

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const json = await response.json();

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### LifeLoop Senior Code Review\n\n${json.candidates[0].content.parts[0].text}`
            });
