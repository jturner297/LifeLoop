name: Auto-Update Documentation

on:
  push:
    branches:
      - IOS-App

jobs:
  update-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run Documentation Agent
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const { execSync } = require("child_process");
            const fs = require("fs");

            if (!process.env.GEMINI_API_KEY) {
              core.setFailed("GEMINI_API_KEY is not configured.");
              return;
            }

            const diff = execSync("git diff HEAD^ HEAD").toString();

            if (!diff || diff.trim() === "") {
              console.log("No code changes detected. Documentation update skipped.");
              return;
            }

            let existingDocs = "";

            try {
              existingDocs = fs.readFileSync("AppReadMe.md", "utf8");
            } catch (error) {
              console.log(
                "AppReadMe.md does not exist yet. A new documentation file will be generated."
              );
            }

            const systemPrompt = `
            You are the iOS documentation agent for the LifeLoop repository.

            Your job is to update AppReadMe.md based only on the code changes included in the supplied commit diff.

            Requirements:

            1. Preserve useful existing documentation.
            2. Add documentation for new features, screens, models, services, Bluetooth behavior, settings, and user flows.
            3. Update documentation when existing behavior has changed.
            4. Remove documentation that is clearly obsolete.
            5. Do not invent features or behavior that are not present in the code.
            6. Keep the documentation clear and organized.
            7. Return only the complete Markdown contents for AppReadMe.md.
            `;

            const prompt = `
            ${systemPrompt}

            Here is the current AppReadMe.md:

            ${existingDocs}

            Here are the new code changes:

            ${diff}

            Rewrite the complete AppReadMe.md so that it accurately documents the current state of the project.
            `;

            const requestBody = {
              contents: [
                {
                  parts: [
                    {
                      text: prompt
                    }
                  ]
                }
              ],
              generationConfig: {
                temperature: 0.2
              }
            };

            const models = [
              "gemini-3.6-flash",
              "gemini-2.5-flash"
            ];

            const retryableStatuses = new Set([
              429,
              500,
              502,
              503,
              504
            ]);

            const maxAttemptsPerModel = 4;

            let response = null;
            let data = null;
            let successfulModel = null;

            for (const model of models) {
              console.log(`Trying Gemini model: ${model}`);

              for (
                let attempt = 1;
                attempt <= maxAttemptsPerModel;
                attempt++
              ) {
                try {
                  response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${process.env.GEMINI_API_KEY}`,
                    {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json"
                      },
                      body: JSON.stringify(requestBody)
                    }
                  );

                  const responseText = await response.text();

                  try {
                    data = responseText
                      ? JSON.parse(responseText)
                      : {};
                  } catch {
                    data = {
                      error: {
                        message: responseText
                      }
                    };
                  }
                } catch (error) {
                  response = null;
                  data = {
                    error: {
                      message: error.message
                    }
                  };

                  console.log(
                    `Gemini network request failed for ${model}, attempt ${attempt}/${maxAttemptsPerModel}`
                  );
                  console.log(error.message);

                  if (attempt >= maxAttemptsPerModel) {
                    break;
                  }

                  const delayMs = Math.min(
                    30000,
                    5000 * Math.pow(2, attempt - 1)
                  );

                  console.log(`Retrying in ${delayMs} ms...`);

                  await new Promise((resolve) =>
                    setTimeout(resolve, delayMs)
                  );

                  continue;
                }

                if (
                  response.ok &&
                  Array.isArray(data.candidates) &&
                  data.candidates.length > 0
                ) {
                  successfulModel = model;
                  break;
                }

                console.log(
                  `Gemini request failed for ${model}, attempt ${attempt}/${maxAttemptsPerModel}, HTTP ${response.status}`
                );

                console.log(
                  "Gemini response:",
                  JSON.stringify(data, null, 2)
                );

                const shouldRetry =
                  retryableStatuses.has(response.status) &&
                  attempt < maxAttemptsPerModel;

                if (!shouldRetry) {
                  break;
                }

                // Exponential backoff: 5s, 10s, 20s.
                const delayMs = Math.min(
                  30000,
                  5000 * Math.pow(2, attempt - 1)
                );

                console.log(`Retrying in ${delayMs} ms...`);

                await new Promise((resolve) =>
                  setTimeout(resolve, delayMs)
                );
              }

              if (successfulModel) {
                break;
              }

              // Try the fallback model only for transient failures.
              if (
                response &&
                !retryableStatuses.has(response.status)
              ) {
                break;
              }
            }

            console.log(
              "RAW GEMINI RESPONSE:",
              JSON.stringify(data, null, 2)
            );

            if (
              !response ||
              !response.ok ||
              !Array.isArray(data?.candidates) ||
              data.candidates.length === 0
            ) {
              const status = response?.status ?? "unknown";
              const message =
                data?.error?.message ??
                "No usable response was returned by Gemini.";

              core.setFailed(
                `Gemini API request failed with HTTP ${status}: ${message}`
              );

              return;
            }

            const documentation =
              data.candidates[0]?.content?.parts
                ?.map((part) => part.text || "")
                .join("")
                .trim();

            if (!documentation) {
              core.setFailed(
                `Gemini returned empty documentation using model ${successfulModel}.`
              );

              return;
            }

            fs.writeFileSync(
              "AppReadMe.md",
              `${documentation}\n`,
              "utf8"
            );

            console.log(
              `AppReadMe.md updated successfully using ${successfulModel}.`
            );

      - name: Commit and Push Changes
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add AppReadMe.md

          if git diff --cached --quiet; then
            echo "No documentation changes needed."
            exit 0
          fi

          git commit -m "docs: auto-updated AppReadMe.md via LLM Agent"
          git push
