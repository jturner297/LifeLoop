name: Auto-Update Documentation
on:
  push:
    branches:
      - IOS-App
jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 

      - name: Run Documentation Agent
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            
            const diff = execSync('git diff HEAD^ HEAD').toString();
            if (!diff) return;

            const systemPrompt = "You are the iOS documentation agent for the LifeLoop repository. Your job is to read any new commits pushed to the branch, and strictly update the AppReadMe.md file to reflect any new software features. Do not modify the root README.md, as that is reserved for hardware. Focus on iOS SwiftUI components, BLE integration, and LocationManager logic.";
            
            let existingDocs = "";
            try { existingDocs = fs.readFileSync('AppReadMe.md', 'utf8'); } catch (e) {}

            const payload = {
              contents: [{
                parts: [{
                  text: `${systemPrompt}\n\nHere is the current AppReadMe.md:\n\n${existingDocs}\n\nHere are the new code changes:\n\n${diff}\n\nRewrite the AppReadMe.md to include these updates.`
                }]
              }]
            };

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const json = await response.json();
            
            // Debug trap to catch future API rejections
            console.log("RAW GEMINI RESPONSE:", JSON.stringify(json, null, 2));

            // Safety check to prevent the 'undefined' crash
            if (!response.ok || !json.candidates || json.candidates.length === 0) {
              core.setFailed(`Gemini API rejected the request. Check the raw response above for details.`);
              return;
            }

            fs.writeFileSync('AppReadMe.md', json.candidates[0].content.parts[0].text);

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AppReadMe.md
          git commit -m "docs: auto-updated AppReadMe.md via LLM Agent" || echo "No doc changes needed"
          git push
